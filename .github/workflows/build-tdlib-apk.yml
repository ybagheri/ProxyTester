name: Build TDLib + APK (arm64-v8a)

# Runs the whole pipeline that this sandbox can't run locally:
#   1. Build TDLib from source for Android via their official Docker setup.
#   2. Drop the output into the :tdlib module.
#   3. Assemble a debug APK containing only the arm64-v8a native slice.
#
# Requires two repo secrets before running (Settings -> Secrets and
# variables -> Actions):
#   TELEGRAM_API_ID    (number, from https://my.telegram.org)
#   TELEGRAM_API_HASH  (string, from https://my.telegram.org)
#
# Trigger manually from the Actions tab ("Run workflow"), or it runs on
# every push to main.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-tdlib:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space (TDLib's build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          docker system prune -af || true

      - name: Checkout TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: td

      - name: Build TDLib for Android via Docker
        # This is TDLib's own documented approach (see
        # td/example/android/README.md). It cross-compiles for all ABIs;
        # we only keep arm64-v8a downstream.
        working-directory: td/example/android
        run: docker build --output tdlib .

      - name: Upload TDLib build output
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-output
          path: td/example/android/tdlib
          retention-days: 7

  build-apk:
    needs: build-tdlib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Download TDLib build output
        uses: actions/download-artifact@v4
        with:
          name: tdlib-android-output
          path: tdlib-output

      - name: Inspect TDLib output layout (debug aid)
        run: find tdlib-output -maxdepth 4 -type d

      - name: Wire TDLib into the :tdlib module
        run: |
          set -e
          mkdir -p tdlib/src/main/java/org/drinkless/tdlib tdlib/src/main/jniLibs/arm64-v8a

          echo "--- Locating TDLib Java sources (org/drinkless/tdlib/*.java) ---"
          JAVA_SRC_DIR=$(find tdlib-output -type d -path "*org/drinkless/tdlib" | head -n1)
          if [ -z "$JAVA_SRC_DIR" ]; then
            echo "::error::Could not find an org/drinkless/tdlib directory anywhere in the TDLib build output."
            echo "Full output tree for debugging:"
            find tdlib-output -maxdepth 8
            exit 1
          fi
          echo "Found Java sources at: $JAVA_SRC_DIR"
          cp "$JAVA_SRC_DIR"/*.java tdlib/src/main/java/org/drinkless/tdlib/

          echo "--- Locating arm64-v8a libtdjni.so ---"
          SO_FILE=$(find tdlib-output -type f -name "libtdjni.so" -path "*arm64-v8a*" | head -n1)
          if [ -z "$SO_FILE" ]; then
            echo "::error::Could not find an arm64-v8a libtdjni.so anywhere in the TDLib build output."
            echo "All .so files found:"
            find tdlib-output -name "*.so"
            exit 1
          fi
          echo "Found: $SO_FILE"
          cp "$SO_FILE" tdlib/src/main/jniLibs/arm64-v8a/

          echo "--- Resulting :tdlib module contents ---"
          find tdlib/src/main -type f | sort

          echo "--- Sanity check: required classes present? ---"
          test -f tdlib/src/main/java/org/drinkless/tdlib/Client.java || { echo "::error::Client.java missing after copy"; exit 1; }
          test -f tdlib/src/main/java/org/drinkless/tdlib/TdApi.java || { echo "::error::TdApi.java missing after copy"; exit 1; }
          echo "OK — Client.java and TdApi.java are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write local.properties from secrets
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build debug APK (arm64-v8a only)
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyTester-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
