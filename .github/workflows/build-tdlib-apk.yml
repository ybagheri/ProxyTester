name: Build TDLib + APK (arm64-v8a)

# This workflow:
# 1. Builds TDLib from source for Android using TDLib's official Docker setup.
# 2. Caches the TDLib build so it does NOT need to be rebuilt on every run
#    (only rebuilds if TDLib's upstream commit changes).
# 3. Downloads the cached/current TDLib output.
# 4. Wires TDLib into the :tdlib module.
# 5. Builds a debug APK containing only arm64-v8a native libraries.
#
# Required repository secrets:
#   TELEGRAM_API_ID
#   TELEGRAM_API_HASH
#
# Can be started manually from Actions, and also runs on every push to main.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:

  # ============================================================
  # JOB 1: Build / restore TDLib
  # ============================================================
  build-tdlib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib source
        id: tdlib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: td
          fetch-depth: 1

      # Cache key includes the TDLib commit SHA, so:
      #   - same TDLib commit as a previous run -> cache HIT -> skip Docker build
      #   - TDLib has a new commit                -> cache MISS -> rebuild
      - name: Restore TDLib build cache
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: td/example/android/tdlib
          key: tdlib-android-${{ steps.tdlib.outputs.commit }}-v1

      - name: Free up disk space
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          docker system prune -af || true

      - name: Build TDLib for Android via Docker
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        working-directory: td/example/android
        run: docker build --output tdlib .

      - name: Inspect TDLib build output
        run: |
          echo "TDLib cache hit: ${{ steps.tdlib-cache.outputs.cache-hit }}"
          echo "--- TDLib output ---"
          find td/example/android/tdlib -maxdepth 4 -type f | sort | head -200

      # Uploaded on every run (cache hit or not) so build-apk always has
      # something to download regardless of whether Docker actually ran.
      - name: Upload TDLib build output
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-output
          path: td/example/android/tdlib
          retention-days: 7

  # ============================================================
  # JOB 2: Build APK
  # ============================================================
  build-apk:
    needs: build-tdlib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Download TDLib build output
        uses: actions/download-artifact@v4
        with:
          name: tdlib-android-output
          path: tdlib-output

      - name: Inspect TDLib output layout
        run: |
          echo "--- Downloaded TDLib output ---"
          find tdlib-output -maxdepth 5 -type f | sort | head -200

      - name: Wire TDLib into the :tdlib module
        run: |
          set -e
          mkdir -p tdlib/src/main/java/org/drinkless/tdlib
          mkdir -p tdlib/src/main/jniLibs/arm64-v8a

          echo "--- Unzipping TDLib output ---"
          # The Docker --output step only produces tdlib.zip / tdlib-debug.zip,
          # not extracted folders — has to be unzipped first.
          if [ -f tdlib-output/tdlib.zip ]; then
            unzip -q tdlib-output/tdlib.zip -d tdlib-output/extracted
          elif [ -f tdlib-output/tdlib-debug.zip ]; then
            unzip -q tdlib-output/tdlib-debug.zip -d tdlib-output/extracted
          else
            echo "::error::Neither tdlib.zip nor tdlib-debug.zip found"
            find tdlib-output -maxdepth 8 -print
            exit 1
          fi

          echo "--- Contents after unzip ---"
          find tdlib-output/extracted -maxdepth 6 -print | head -200

          echo "--- Locating TDLib Java sources ---"
          JAVA_SRC_DIR=$(find tdlib-output/extracted -type d -path "*org/drinkless/tdlib" | head -n1)
          if [ -z "$JAVA_SRC_DIR" ]; then
            echo "::error::Could not find org/drinkless/tdlib directory"
            find tdlib-output/extracted -maxdepth 10 -print
            exit 1
          fi
          echo "Found: $JAVA_SRC_DIR"
          cp "$JAVA_SRC_DIR"/*.java tdlib/src/main/java/org/drinkless/tdlib/

          echo "--- Locating arm64-v8a libtdjni.so ---"
          SO_FILE=$(find tdlib-output/extracted -type f -name "libtdjni.so" -path "*arm64-v8a*" | head -n1)
          if [ -z "$SO_FILE" ]; then
            echo "::error::Could not find arm64-v8a libtdjni.so"
            find tdlib-output/extracted -name "*.so" -print
            exit 1
          fi
          echo "Found: $SO_FILE"
          cp "$SO_FILE" tdlib/src/main/jniLibs/arm64-v8a/

          echo "--- Resulting :tdlib module ---"
          find tdlib/src/main -type f | sort

          echo "--- Sanity check ---"
          test -f tdlib/src/main/java/org/drinkless/tdlib/Client.java
          test -f tdlib/src/main/java/org/drinkless/tdlib/TdApi.java
          test -f tdlib/src/main/jniLibs/arm64-v8a/libtdjni.so
          echo "TDLib Java sources and arm64-v8a native library are OK."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write local.properties from secrets
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" >> local.properties
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build debug APK (arm64-v8a only)
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyTester-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
